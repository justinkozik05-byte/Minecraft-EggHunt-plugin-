name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: DragonEggOwner
          path: target/DragonEggOwner.jar
